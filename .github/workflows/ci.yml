name: CI

# The factory's own pre-ship gate — it now holds itself to the same "automated gate
# before shipping" rule the Feature Playbook mandates for every product it builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Invoke the harness checks DIRECTLY (not `npm run check`/`npm test`) so this workflow
      # works unchanged when copied into a repo whose package.json defines its own check/test
      # scripts. Zero npm dependencies — the harness is 100% Node built-ins.
      - name: Parse-check every harness script
        run: node scripts/__tests__/syntax.check.mjs
      - name: Harness test suite
        run: node --test scripts/__tests__/
